<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GAME TITLE — Template</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0b1020; font-family: system-ui, sans-serif; color: #eef2ff; }
  canvas { display: block; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(5, 8, 20, .88); z-index: 10; text-align: center; padding: 16px; }
  #menu h1 { margin: 0; font-size: 42px; }
  #menu p { margin: 0 0 8px; color: #9fb0e0; }
  .btn { padding: 12px 26px; font-size: 16px; border: 0; border-radius: 12px; background: #e8212f; color: #fff; cursor: pointer; }
  .btn.ghost { background: #232c4d; }
  #version-line { margin-top: 12px; font-size: 12.5px; color: #7d8fc9; }
  #audio-status { font-size: 11.5px; color: #7d8fc9; min-height: 16px; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  #hud .top { position: absolute; top: 12px; left: 14px; font-size: 17px; font-weight: 700; text-shadow: 0 1px 4px #000; }
  #hud .bar { position: absolute; top: 40px; left: 14px; width: 200px; height: 14px; background: #333; border-radius: 8px; overflow: hidden; }
  #hud .bar i { display: block; height: 100%; background: #3ddc84; }
  #hud .btns { position: absolute; top: 12px; right: 12px; pointer-events: auto; display: flex; gap: 8px; }
  #hud .btns button { width: 44px; height: 44px; font-size: 20px; border: 0; border-radius: 10px; background: rgba(20, 26, 50, .85); color: #fff; cursor: pointer; }
  #cross { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; z-index: 4; display: none; text-shadow: 0 1px 4px #000; }
  #joy { position: fixed; left: 18px; bottom: 22px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); z-index: 6; display: none; touch-action: none; }
  #joyKnob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.35); }
  #btn-fire { position: fixed; right: 22px; bottom: 30px; width: 84px; height: 84px; border-radius: 50%; background: rgba(232,33,47,.85); color: #fff; font-size: 30px; border: 0; z-index: 6; display: none; touch-action: none; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(10, 14, 30, .92); padding: 10px 18px; border-radius: 10px; font-size: 14px; z-index: 20; display: none; }
</style>
</head>
<body>
<div id="menu">
  <h1>🤖 GAME TITLE</h1>
  <p>Template game 3D — thay tên, nhân vật, luật chơi rồi chạy. WASD di chuyển, chuột ngắm, click bắn.</p>
  <button class="btn" id="btn-start">▶ Bắt đầu</button>
  <button class="btn ghost" id="btn-quality">⚙️ Chất lượng: Tự động</button>
  <button class="btn ghost" id="btn-soundtest">🔊 Kiểm tra tiếng</button>
  <div id="audio-status"></div>
  <div id="version-line"></div>
</div>
<div id="hud">
  <div class="top" id="hud-top">Điểm 0 · Wave 1</div>
  <div class="bar"><i id="hp-bar" style="width:100%"></i></div>
  <div class="btns"><button id="btn-mute">🔊</button><button id="btn-pause">⏸</button></div>
</div>
<div id="cross">+</div>
<div id="joy"><div id="joyKnob"></div></div>
<button id="btn-fire">🔥</button>
<div id="toast"></div>
<script type="importmap">{"imports": {"three": "./lib/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
// ============ 1. VERSION — đổi 2 dòng này mỗi lần đóng version ============
const GAME_VERSION = 'v0.1';
const VERSION_NAME = 'Seed'; // tên mã 1 từ kiểu model AI, gợi đúng điểm nhấn của bản
const SAVE_PREFIX = 'mygame'; // ĐỔI THÀNH slug game mới (vd 'robot-arena'): mọi key localStorage ăn theo prefix này

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ============ 2. AUDIO — bộ bắt buộc, đừng rút gọn (bài học iOS: 2 lớp khóa) ============
// Lớp 1: iOS chỉ cho AudioContext chạy khi mở khóa TRONG cử chỉ thật.
// Lớp 2: WebAudio chạy kênh ambient → công tắc im lặng giết tiếng; iOS 17+ đặt
// navigator.audioSession.type='playback' để sang kênh playback, qua mặt công tắc.
function setPlaybackSession() { try { const s = navigator.audioSession; if (s) s.type = 'playback'; } catch (e) { } }
setPlaybackSession();
let AC = null, audioUnlocked = false;
let muted = false; try { muted = localStorage.getItem(SAVE_PREFIX + '-muted') === '1'; } catch (e) { }
function audio() { setPlaybackSession(); if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (AC && AC.state === 'suspended') AC.resume(); if (AC && AC.state === 'running') audioUnlocked = true; return AC; }
function beep(freq, dur, type, vol, slide) { const ac = audio(); if (!ac || muted) return; try { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime; o.type = type || 'square'; o.frequency.setValueAtTime(freq, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur); g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur); } catch (e) { } }
let sharedNoise = null; // 1 buffer dùng chung — đừng cấp phát buffer mới mỗi phát (gây giật)
function noiseBurst(dur, vol) { const ac = audio(); if (!ac || muted) return; try { if (!sharedNoise) { const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; sharedNoise = b; } const src = ac.createBufferSource(), g = ac.createGain(), t = ac.currentTime; src.buffer = sharedNoise; g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); src.connect(g).connect(ac.destination); src.start(t); src.stop(t + dur); } catch (e) { } }
const SFX = {
  shoot() { beep(720, 0.08, 'square', 0.10, 220); },
  hit() { noiseBurst(0.12, 0.22); },
  wave() { beep(520, 0.15, 'square', 0.15); setTimeout(() => beep(780, 0.2, 'square', 0.15), 120); },
  over() { beep(400, 0.3, 'sawtooth', 0.15, 90); },
  click() { beep(900, 0.05, 'square', 0.08); },
};
function refreshAudioStatus(extra = '') { const el = $('audio-status'); if (!el) return; const sess = (navigator.audioSession && navigator.audioSession.type) || 'không hỗ trợ (iOS cũ)'; el.textContent = 'Âm thanh: ' + (AC ? AC.state : 'chưa mở') + (muted ? ' · ĐANG TẮT TIẾNG' : ' · đang bật') + ' · phiên: ' + sess + extra; }
function refreshMuteUI() { const b = $('btn-mute'); if (b) b.textContent = muted ? '🔇' : '🔊'; refreshAudioStatus(); }
function toggleMute() { muted = !muted; try { localStorage.setItem(SAVE_PREFIX + '-muted', muted ? '1' : '0'); } catch (e) { } refreshMuteUI(); SFX.click(); }
function unlockAudio() { // gọi trong MỌI cử chỉ; phát node câm trong cử chỉ để khóa thật sự mở
  setPlaybackSession(); const ac = audio(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  if (!audioUnlocked) { try { const o = ac.createOscillator(), g = ac.createGain(); g.gain.value = 0; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.05); } catch (e) { } }
  if (ac.state === 'running') audioUnlocked = true; refreshAudioStatus();
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, unlockAudio, { passive: true }));
function soundTest() { unlockAudio(); if (muted) { refreshAudioStatus(' — bấm nút 🔊 góc trên để bật tiếng'); toast('🔇 Đang tắt tiếng — bấm nút 🔊 góc phải trên để bật lại'); return; } beep(880, 0.4, 'square', 0.25); setTimeout(() => beep(1320, 0.4, 'square', 0.25), 300); setTimeout(() => noiseBurst(0.3, 0.25), 650); refreshAudioStatus(' — vừa phát tiếng kiểm tra'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

// ============ 3. QUALITY — 3 nấc + tự hạ khi FPS thấp (không bao giờ tự tăng lại) ============
let qualityPref = 'auto'; try { qualityPref = localStorage.getItem(SAVE_PREFIX + '-quality') || 'auto'; } catch (e) { }
let qualityLevel = 'high';
const QUALITY_LABEL = { auto: 'Tự động', high: 'Cao', medium: 'Trung bình', low: 'Thấp' };
function setQualityPref(pref) { qualityPref = pref; try { localStorage.setItem(SAVE_PREFIX + '-quality', pref); } catch (e) { } refreshQualityBtn(); if (pref !== 'auto') applyQuality(pref); }
function refreshQualityBtn() { $('btn-quality').textContent = '⚙️ Chất lượng: ' + QUALITY_LABEL[qualityPref] + (qualityPref === 'auto' ? ' (' + ({ high: 'Cao', medium: 'Trung bình', low: 'Thấp' })[qualityLevel] + ')' : ''); }
function applyQuality(level) {
  qualityLevel = level;
  const dpr = level === 'high' ? Math.min(devicePixelRatio, 2) : level === 'medium' ? 1.5 : 1;
  renderer.setPixelRatio(dpr);
  renderer.shadowMap.enabled = level !== 'low';
  renderer.shadowMap.needsUpdate = true;
  scene.traverse(o => { if (o.material) o.material.needsUpdate = true; });
  refreshQualityBtn();
}

// ============ 4. WORLD ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b1020); scene.fog = new THREE.Fog(0x0b1020, 30, 90);
const camera = new THREE.PerspectiveCamera(100, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a2038, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(20, 30, 10); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x2a7a3d }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// vài chướng ngại vật để test va chạm + tầm nhìn
const obstacleMat = new THREE.MeshStandardMaterial({ color: 0x8a93a8 });
[[8, 0, -8], [-10, 0, -6], [0, 0, -16], [12, 0, 4], [-14, 0, 8]].forEach(([x, , z]) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3), obstacleMat); b.position.set(x, 1.5, z); b.castShadow = true; scene.add(b);
});
const player = { pos: new THREE.Vector3(0, 1.7, 10), yaw: 0, pitch: 0, hp: 100, maxHp: 100, speed: 8 };
const state = { playing: false, paused: false, score: 0, best: 0, wave: 1, time: 0, enemiesLeft: 0, spawnTimer: 0 };
try { state.best = +(localStorage.getItem(SAVE_PREFIX + '-best') || 0); } catch (e) { }
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyM') toggleMute(); if (e.code === 'KeyP') togglePause(); });
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('mousemove', e => { if (document.pointerLockElement !== renderer.domElement || !state.playing) return; player.yaw -= e.movementX * 0.0022; player.pitch = clamp(player.pitch - e.movementY * 0.0022, -1.2, 1.2); });
renderer.domElement.addEventListener('click', () => { if (state.playing && document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock(); });
const isTouch = new URLSearchParams(location.search).get('touch') === '1' || 'ontouchstart' in window;
let joyVec = { x: 0, y: 0 };
if (isTouch) { $('joy').style.display = 'block'; $('btn-fire').style.display = 'block';
  const joy = $('joy'), knob = $('joyKnob'); let joyId = null;
  joy.addEventListener('touchstart', e => { joyId = e.changedTouches[0].identifier; }, { passive: true });
  joy.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === joyId) { const r = joy.getBoundingClientRect(); joyVec = { x: clamp((t.clientX - (r.left + 55)) / 45, -1, 1), y: clamp((t.clientY - (r.top + 55)) / 45, -1, 1) }; knob.style.left = (30 + joyVec.x * 28) + 'px'; knob.style.top = (30 + joyVec.y * 28) + 'px'; } }, { passive: true });
  const endJoy = e => { for (const t of e.changedTouches) if (t.identifier === joyId) { joyId = null; joyVec = { x: 0, y: 0 }; knob.style.left = '30px'; knob.style.top = '30px'; } };
  joy.addEventListener('touchend', endJoy); joy.addEventListener('touchcancel', endJoy);
  $('btn-fire').addEventListener('touchstart', e => { e.preventDefault(); tryShoot(); }, { passive: false });
}

// ============ 5. ENTITIES — địch hộp + đạn (vật liệu dùng chung, KHÔNG đèn theo đạn) ============
const enemies = [], bullets = [];
const enemyMat = new THREE.MeshStandardMaterial({ color: 0xe8212f });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd23f }); // unlit: nhìn như đạn phát sáng mà không tốn đèn
function spawnEnemy(x, z) { const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2, 1.4), enemyMat); body.position.y = 1; body.castShadow = true; const eye = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), eyeMat); eye.position.set(0, 1.5, 0.75); g.add(body, eye); g.position.set(x, 0, z); scene.add(g); enemies.push({ g, hp: 2, speed: 2.5 + state.wave * 0.2, hitCd: 0 }); }
function burst(pos, color) { const geo = new THREE.BufferGeometry(); const n = 14, arr = new Float32Array(n * 3); for (let i = 0; i < n; i++) { arr[i * 3] = pos.x + (Math.random() - 0.5) * 1.2; arr[i * 3 + 1] = pos.y + Math.random() * 1.2; arr[i * 3 + 2] = pos.z + (Math.random() - 0.5) * 1.2; } geo.setAttribute('position', new THREE.BufferAttribute(arr, 3)); const p = new THREE.Points(geo, new THREE.PointsMaterial({ color, size: 0.22 })); p.userData.life = 0.4; scene.add(p); burst.list.push(p); }
burst.list = [];
let shootCd = 0;
function tryShoot() { if (!state.playing || state.paused || shootCd > 0) return; shootCd = 0.16; const dir = new THREE.Vector3(); camera.getWorldDirection(dir); const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.7), bulletMat); m.position.copy(camera.position).addScaledVector(dir, 1); scene.add(m); bullets.push({ m, vel: dir.multiplyScalar(60), life: 2, prev: m.position.clone() }); SFX.shoot(); }
addEventListener('mousedown', e => { if (e.target === renderer.domElement) tryShoot(); });
function distToSegment(c, a, b) { const ab = new THREE.Vector3().subVectors(b, a); const t = clamp(new THREE.Vector3().subVectors(c, a).dot(ab) / Math.max(ab.lengthSq(), 1e-6), 0, 1); return new THREE.Vector3().addVectors(a, ab.multiplyScalar(t)).distanceTo(c); }
function damageEnemy(e, dmg) { e.hp -= dmg; if (e.hp <= 0) { scene.remove(e.g); enemies.splice(enemies.indexOf(e), 1); state.score += 10; burst(e.g.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xffd23f); SFX.hit(); } }

// ============ 6. FLOW ============
function startWave(n) { state.wave = n; state.spawnTimer = 0; state.enemiesLeft = 3 + n * 2; SFX.wave(); toast('Wave ' + n + ' — ' + state.enemiesLeft + ' địch!'); }
function startGame() { unlockAudio(); if (muted) toast('🔇 Đang tắt tiếng — bấm nút 🔊 góc phải trên để bật lại'); Object.assign(player, { pos: new THREE.Vector3(0, 1.7, 10), yaw: 0, pitch: 0, hp: 100 }); state.playing = true; state.paused = false; state.score = 0; state.time = 0; enemies.splice(0).forEach(e => scene.remove(e.g)); bullets.splice(0).forEach(b => scene.remove(b.m)); $('menu').style.display = 'none'; $('hud').style.display = 'block'; $('cross').style.display = 'block'; startWave(1); }
function gameOver() { state.playing = false; document.exitPointerLock?.(); if (state.score > state.best) { state.best = state.score; try { localStorage.setItem(SAVE_PREFIX + '-best', state.best); } catch (e) { } } SFX.over(); $('hud').style.display = 'none'; $('cross').style.display = 'none'; $('menu').style.display = 'flex'; $('menu').querySelector('p').textContent = 'Kết thúc! Điểm ' + state.score + ' · Kỷ lục ' + state.best + ' — bấm Bắt đầu chơi lại.'; }
function togglePause() { if (!state.playing) return; state.paused = !state.paused; $('btn-pause').textContent = state.paused ? '▶' : '⏸'; }
$('btn-start').addEventListener('click', startGame);
$('btn-pause').addEventListener('click', togglePause);
$('btn-mute').addEventListener('click', toggleMute);
$('btn-quality').addEventListener('click', () => setQualityPref(qualityPref === 'auto' ? 'high' : qualityPref === 'high' ? 'medium' : qualityPref === 'medium' ? 'low' : 'auto'));
$('btn-soundtest').addEventListener('click', soundTest);
$('version-line').textContent = 'Phiên bản ' + GAME_VERSION + ' "' + VERSION_NAME + '" · Kỷ lục: ' + state.best;
applyQuality('high'); refreshQualityBtn(); refreshMuteUI(); refreshAudioStatus();

// ============ 7. LOOP — HUD chỉ ghi DOM khi số đổi; dt kẹp để không xoắn khi lag ============
const clock = new THREE.Clock(); let fpsAcc = 0, fpsN = 0, fpsT = 0; const hudCache = {};
function setHud(id, val) { if (hudCache[id] !== val) { hudCache[id] = val; $(id).textContent = val; } }
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05); // kẹp dt: lag không sinh thêm bước vật lý
  fpsAcc += dt; fpsN++; fpsT += dt;
  if (fpsT >= 2.5) { const fps = fpsN / fpsAcc; if (qualityPref === 'auto' && fps < 45 && qualityLevel !== 'low') { applyQuality(qualityLevel === 'high' ? 'medium' : 'low'); toast('⚡ Đã tự giảm chất lượng để giữ game mượt'); } fpsAcc = 0; fpsN = 0; fpsT = 0; }
  if (state.playing && !state.paused) {
    state.time += dt; shootCd = Math.max(0, shootCd - dt);
    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
    player.pos.x += (sin * -f + cos * s + joyVec.x * cos) * player.speed * dt;
    player.pos.z += (cos * -f - sin * s + joyVec.y * cos) * player.speed * dt;
    player.pos.x = clamp(player.pos.x, -55, 55); player.pos.z = clamp(player.pos.z, -55, 55);
    camera.position.copy(player.pos); camera.rotation.set(player.pitch, player.yaw, 0, 'YXZ');
    if (state.enemiesLeft > 0) { state.spawnTimer -= dt; if (state.spawnTimer <= 0 && enemies.length < state.enemiesLeft) { const a = Math.random() * Math.PI * 2, d = 24 + Math.random() * 10; spawnEnemy(player.pos.x + Math.sin(a) * d, player.pos.z + Math.cos(a) * d); state.spawnTimer = 0.7; } }
    else if (enemies.length === 0) startWave(state.wave + 1);
    for (let i = enemies.length - 1; i >= 0; i--) { const e = enemies[i]; e.hitCd = Math.max(0, e.hitCd - dt); const d = new THREE.Vector3().subVectors(player.pos, e.g.position); d.y = 0; const dist = d.length(); if (dist > 0.1) e.g.position.addScaledVector(d.normalize(), e.speed * dt); e.g.lookAt(player.pos.x, 0, player.pos.z); if (dist < 1.6 && e.hitCd <= 0) { e.hitCd = 0.6; player.hp -= 10; SFX.hit(); if (player.hp <= 0) gameOver(); } }
    for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; b.prev.copy(b.m.position); b.m.position.addScaledVector(b.vel, dt); b.life -= dt; let dead = b.life <= 0; if (!dead) for (let j = enemies.length - 1; j >= 0; j--) { if (distToSegment(enemies[j].g.position.clone().add(new THREE.Vector3(0, 1, 0)), b.prev, b.m.position) < 1.3) { damageEnemy(enemies[j], 1); dead = true; break; } } if (dead || b.m.position.length() > 90) { scene.remove(b.m); bullets.splice(i, 1); } }
    for (let i = burst.list.length - 1; i >= 0; i--) { const p = burst.list[i]; p.userData.life -= dt; p.position.y += dt * 2; if (p.userData.life <= 0) { scene.remove(p); burst.list.splice(i, 1); } }
    setHud('hud-top', 'Điểm ' + state.score + ' · Wave ' + state.wave + ' · Địch ' + enemies.length);
    const hpPct = Math.max(0, player.hp) + '%'; if (hudCache.hp !== hpPct) { hudCache.hp = hpPct; $('hp-bar').style.width = hpPct; }
  }
  renderer.render(scene, camera);
}
animate();

// ============ 8. DEBUG HOOKS — test tự động + chẩn đoán không cần chơi tay ============
window.KTEAM = { scene, state, player, enemies, bullets, spawnEnemy, startGame, applyQuality, setQualityPref, get qualityLevel() { return qualityLevel; }, get qualityPref() { return qualityPref; }, audio, unlockAudio, SFX, get audioState() { return AC ? AC.state : 'none'; }, get muted() { return muted; } };
if (new URLSearchParams(location.search).get('autotest') === '1') { setTimeout(() => { startGame(); spawnEnemy(player.pos.x, player.pos.z - 7); setTimeout(() => { window.__AUTOTEST__ = { score: state.score, enemies: enemies.length, playing: state.playing }; document.title = 'AUTOTEST_DONE'; }, 12000); }, 500); }
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
